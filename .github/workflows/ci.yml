# CI for the You Decide seller app.
#
# Replaces the docs-only scaffold check that stood in while the stack was
# undecided (see STACK_DECISION.md). Three gates, all required:
#   typecheck → lint → test
name: CI

on:
  push:
    branches: [main]
  pull_request:

# A new push to a PR cancels the in-flight run for that PR.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    name: typecheck · lint · test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      # `npm ci` — the lockfile is the source of truth, so CI installs exactly
      # what was developed against.
      - name: Install dependencies
        run: npm ci

      - name: Typecheck
        run: npm run typecheck

      - name: Lint
        run: npm run lint

      - name: Test
        run: npm run test:ci
